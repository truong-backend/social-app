name: Deploy Frontend — Social App
 
on:
  push:
    branches: [front-end]
 
env:
  IMAGE_NAME: truong-backend/social-app-frontend
 
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/${{ env.IMAGE_NAME }}:latest
          build-args: |
            NEXT_PUBLIC_API_URL=https://mangxahoi.deploy-my-project.site/api
            NEXT_PUBLIC_SOCKET_ENDPOINT=https://mangxahoi.deploy-my-project.site/ws
            NEXT_PUBLIC_GOOGLE_CLIENT_ID=176404193195-jheo3d57jo8qvnho2kpf860so1cf66q1.apps.googleusercontent.com
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            cd /opt/social-app
            docker compose pull frontend
            docker compose up -d frontend
            docker image prune -f
