spring:
  application:
    name: social-network-api

  # ===================== AI (Gemini) =====================
  ai:
    openai:
      api-key: ${GEMINI_KEY}
      chat:
        base-url: https://generativelanguage.googleapis.com
        completions-path: /v1beta/openai/chat/completions
        options:
          model: gemini-2.0-flash

  # ===================== FILE UPLOAD =====================
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 105MB

  # ===================== NEO4J =====================
  neo4j:
    uri: ${NEO4J_URI}
    authentication:
      username: ${NEO4J_USER}
      password: ${NEO4J_PASS}

  # ===================== REDIS =====================
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      timeout: 60000
      repositories:
        enabled: true
      username: ${REDIS_USERNAME}
      password: ${REDIS_PASSWORD}
      ssl:
        enabled: false

  # ===================== DATABASE (SQLite) =====================
  datasource:
    url: jdbc:sqlite:/data/online_users.db

  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    show-sql: true
    hibernate:
      ddl-auto: update

  # ===================== MAIL =====================
  mail:
    host: ${MAIL_HOST:smtp-relay.brevo.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          ssl:
            enable: false

  # ===================== GOOGLE OAUTH2 =====================
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: email, profile
            redirect-uri: ${GOOGLE_REDIRECT_URI}

# ===================== SERVER =====================
server:
  port: 2003
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        same-site: none
        secure: true

# ===================== JWT =====================
jwt:
  access-token:
    key: ${JWT_ACCESS_TOKEN_KEY}
    duration: ${JWT_ACCESS_TOKEN_DURATION}
  refresh-token:
    duration: ${JWT_REFRESH_TOKEN_DURATION}

# ===================== ORIGIN =====================
origin:
  front-end: ${FRONTEND_ORIGIN}
  self: ${SELF_ORIGIN}

# ===================== OAUTH2 REDIRECT =====================
app:
  oauth2:
    frontend-redirect-url: ${OAUTH2_FRONTEND_REDIRECT}

# ===================== STRINGEE =====================
stringee:
  api:
    sid: ${STRINGEE_API_SID}
    secret-key: ${STRINGEE_API_SECRET_KEY}

# ===================== LOGGING =====================
logging:
  level:
    root: error
    com:
      stu:
        socialnetworkapi: DEBUG

# ===================== ACTUATOR =====================
management:
  endpoints:
    web:
      exposure:
        include: "health,info,prometheus"
  endpoint:
    health:
      show-details: always

# ===================== MINIO =====================
minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin}
  bucket: ${MINIO_BUCKET:social-app}
  presigned-url-expiry: ${MINIO_PRESIGNED_EXPIRY:3600}