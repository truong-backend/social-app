version: '3.8'
name: social-network

services:
  neo4j:
    image: neo4j:5.20-community
    container_name: social-neo4j
    environment:
      NEO4J_AUTH: neo4j/123456789
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: apoc.*
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1G
      NEO4J_server_memory_pagecache_size: 512m
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - /opt/social-app/neo4j-import:/var/lib/neo4j/import
    networks:
      - social-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  redis-social:
    image: redis:7.2-alpine
    container_name: social-redis
    volumes:
      - redis_social_data:/data
    networks:
      - social-net
    restart: unless-stopped

  api:
    image: ghcr.io/truong-backend/social-app-backend:latest
    container_name: social-api
    env_file:
      - /opt/social-app/.env
    volumes:
      - /opt/social-app/upload:/app/upload
      - /opt/social-app/data:/data
    ports:
      - "2003:2003"
    depends_on:
      neo4j:
        condition: service_healthy
      redis-social:
        condition: service_started
    networks:
      - social-net
    restart: unless-stopped

  frontend:
    image: ghcr.io/truong-backend/social-app-frontend:latest
    container_name: social-frontend
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
    depends_on:
      - api
    networks:
      - social-net
    restart: unless-stopped

networks:
  social-net:
    driver: bridge

volumes:
  redis_social_data:
  neo4j_data:
  neo4j_logs: