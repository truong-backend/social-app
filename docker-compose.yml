# docker-compose.yml — nhánh back-end của social-app
version: '3.8'
name: social-network

services:
  redis-social:
    image: redis:7.2-alpine
    container_name: social-redis
    volumes:
      - redis_social_data:/data
    networks:
      - social-net
    restart: unless-stopped

  api:
    image: ghcr.io/truong-backend/social-app-backend:latest
    container_name: social-api
    env_file:
      - /opt/social-app/.env
    volumes:
      - /opt/social-app/upload:/app/upload
      - /opt/social-app/data:/data
    ports:
      - "2003:2003"
    depends_on:
      - redis-social
    networks:
      - social-net
    restart: unless-stopped

  frontend:
    image: ghcr.io/truong-backend/social-app-frontend:latest
    container_name: social-frontend
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
    depends_on:
      - api
    networks:
      - social-net
    restart: unless-stopped

networks:
  social-net:
    driver: bridge

volumes:
  redis_social_data: