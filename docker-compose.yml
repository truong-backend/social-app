# docker-compose.local.yml — social-app (local / dev)
# ─────────────────────────────────────────────────────────────────
# Cách dùng:
#   docker compose --env-file .env.local -f docker-compose.local.yml up --build
#
# Truy cập:
#   API        → http://localhost:2003
#   Neo4j UI   → http://localhost:7474
#   MinIO UI   → http://localhost:9001
#   Redis      → localhost:6379
# ─────────────────────────────────────────────────────────────────
version: '3.8'
name: social-network-local

services:

  # ── Neo4j ────────────────────────────────────────────────────────
  neo4j:
    image: neo4j:5.20-community
    container_name: social-neo4j
    env_file:
      - .env.local
    environment:
      # NEO4J_AUTH phải có dạng "user/pass" — đọc thẳng từ biến đã
      # được load vào Compose context bằng --env-file ở câu lệnh chạy
      NEO4J_AUTH: ${NEO4J_USER}/${NEO4J_PASS}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: apoc.*
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1G
      NEO4J_server_memory_pagecache_size: 512m
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    networks:
      - social-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ── Redis ─────────────────────────────────────────────────────────
  redis-social:
    image: redis:7.2-alpine
    container_name: social-redis
    env_file:
      - .env.local
    command: >
      sh -c '
        if [ -n "$$REDIS_PASSWORD" ]; then
          redis-server --requirepass $$REDIS_PASSWORD
        else
          redis-server
        fi
      '
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - social-net
    restart: unless-stopped

  # ── MinIO ─────────────────────────────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: social-minio
    env_file:
      - .env.local
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - social-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ── MinIO bucket init (chạy 1 lần rồi thoát) ─────────────────────
  minio-init:
    image: minio/mc:latest
    container_name: social-minio-init
    env_file:
      - .env.local
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - social-net
    entrypoint: >
      /bin/sh -c "
        mc alias set local ${MINIO_ENDPOINT} ${MINIO_ACCESS_KEY} ${MINIO_SECRET_KEY} &&
        mc mb --ignore-existing local/${MINIO_BUCKET} &&
        mc anonymous set public local/${MINIO_BUCKET} &&
        echo 'Bucket ${MINIO_BUCKET} ready.'
      "
    restart: "no"

  # ── Spring Boot API ───────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: social-api
    env_file:
      - .env.local
    volumes:
      - ./upload:/app/upload
      - sqlite_data:/data
    ports:
      - "2003:2003"
    depends_on:
      neo4j:
        condition: service_healthy
      redis-social:
        condition: service_started
      minio:
        condition: service_healthy
    networks:
      - social-net
    restart: unless-stopped

networks:
  social-net:
    driver: bridge

volumes:
  neo4j_data:
  neo4j_logs:
  redis_data:
  minio_data:
  sqlite_data: