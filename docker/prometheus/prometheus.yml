global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'social-network-api'
    metrics_path: '/actuator/prometheus'
    scrape_interval: 5s
    static_configs:
      # Use host.docker.internal to reach the host machine where Spring Boot is running locally
      - targets: ['host.docker.internal:2003']
